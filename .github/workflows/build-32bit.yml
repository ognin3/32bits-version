name: Build IPTV 32-bit (x86)

on:
  workflow_dispatch:

jobs:
  build-32bit:
    runs-on: windows-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 32 bits (x86)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip setuptools pyinstaller
          python -m pip install -r requirements.txt
          python -m pip install PyQt5 lxml requests python-dateutil

      - name: Rodar o build (32 bits)
        run: |
          cmd /c "build_iptv_player.bat < NUL"

      - name: Salvar o executável para Download
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-32bits
          path: dist/
